[tokens.elevation]
web = "--md-sys-elevation-level{0..5} (tonal + shadow)"
gtk = "box-shadow in generated CSS (.card, popovers)"
qt = "Material.elevation"
cosmic = "none (flat); theme.shade for overlays"
