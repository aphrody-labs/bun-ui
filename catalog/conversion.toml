qt = "Material.font roles / Kirigami.Heading level + Kirigami.Theme.defaultFont"
cosmic = "cosmic::widget::text::{title1..4, heading, body, caption, caption_heading, monotext}"
egui = "style.text_styles (TextStyle::Heading/Body/Button/Small/Monospace + custom Name)"
