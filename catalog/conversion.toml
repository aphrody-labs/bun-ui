# Bun UI conversion catalog: one Material 3 contract, every host.
#
# Source of truth for the token emitters (`aphrody-m3-emit`), the TSX/CSS converter and the
# host adapters. Rust reads it with serde/toml, Bun with Bun.TOML. Each entry names the
# canonical M3 concept and the closest construct per host. `none` means the host has no
# equivalent and the adapter draws it from the M3 primitives (tier A) or composes it (tier B).
#
# Hosts:
#   web     material-web <md-*> / @aphrody/m3-baseui (Base UI) / CSS custom properties
#   gtk     GTK 4.16+ with libadwaita 1.6+ through gtk4-rs / libadwaita-rs
#   qt      Qt 6.8+ Qt Quick Controls (Material style) + Kirigami, through cxx-qt
#   cosmic  libcosmic (pop-os iced fork) and cosmic-theme
#   egui    egui 0.32+
#   bevy    bevy_ui 0.17+ with bevy_ui_widgets (headless) and the M3 skin
#   winui   WinUI 3 / Windows App SDK 1.7+ (CommunityToolkit where noted)
#   win32   classic Win32 through windows-rs (common controls v6)
#
# Tiers: A = Bun UI draws the component (pixel-identical M3): web, egui, bevy, wgpu/vello,
#        Qt with the Bun UI Controls style. B = Bun UI themes native widgets: gtk, cosmic,
#        winui, win32, KDE/Plasma.

[meta]
schema = 1
m3_owner = "crates/aphrody-m3-tokens"
contract_owner = "crates/aphrody-m3"
updated = "2026-10-25"

# ---------------------------------------------------------------------------------------------
# Color roles. M3 role -> per-host theme slot. Emitters resolve the role with HCT in Rust, then
# write the slot. Light and dark are emitted separately; contrast levels map to each host's
# high-contrast variant where one exists.
# ---------------------------------------------------------------------------------------------
