# ---------------------------------------------------------------------------------------------
# Application and platform APIs. Bun UI exposes one trait/TS interface per row; adapters call
# the host construct below.
# ---------------------------------------------------------------------------------------------
[apis.app_lifecycle]
tauri = "tauri::Builder::default().run()"
winit = "EventLoop + ApplicationHandler"
gtk = "adw::Application::run (GApplication)"
qt = "QGuiApplication + QQmlApplicationEngine (cxx-qt)"
cosmic = "cosmic::app::run::<impl cosmic::Application>"
egui = "eframe::run_native"
bevy = "App::new().add_plugins(DefaultPlugins).run()"
win32 = "RegisterClassExW + GetMessageW loop"
web = "DOM load + requestAnimationFrame"

[apis.window]
tauri = "WebviewWindowBuilder"
winit = "ActiveEventLoop::create_window(WindowAttributes)"
gtk = "adw::ApplicationWindow"
qt = "ApplicationWindow (QML) / QQuickWindow"
cosmic = "cosmic::app::Settings + window::open (multi-window)"
egui = "ViewportBuilder (eframe viewports)"
bevy = "Window component"
win32 = "CreateWindowExW"
web = "document / <iframe> per app in WebOS"

[apis.menu_bar]
tauri = "tauri::menu::Menu / MenuBuilder"
winit = "muda crate"
gtk = "gio::Menu + gtk::PopoverMenuBar"
qt = "MenuBar / Platform.MenuBar (Qt.labs.platform)"
cosmic = "widget::menu::bar"
egui = "egui::menu::bar"
win32 = "CreateMenu + SetMenu"
web = "Bun UI menu bar component"

[apis.tray]
tauri = "tauri::tray::TrayIconBuilder"
winit = "tray-icon crate"
gtk = "StatusNotifierItem via ksni (no GTK API)"
qt = "QSystemTrayIcon / Platform.SystemTrayIcon"
cosmic = "StatusNotifierItem (cosmic-applet-status-area host)"
win32 = "Shell_NotifyIconW"
web = "WebOS shell tray area"

[apis.file_dialog]
tauri = "tauri-plugin-dialog"
winit = "rfd crate"
gtk = "gtk::FileDialog (4.10+), XDG portal underneath"
qt = "FileDialog (QtQuick.Dialogs) / QFileDialog"
cosmic = "cosmic::dialog::file_chooser (XDG portal)"
egui = "rfd crate"
win32 = "IFileOpenDialog / IFileSaveDialog (COM)"
web = "showOpenFilePicker / <input type=file>; WebOS OPFS chooser"

[apis.notification]
tauri = "tauri-plugin-notification"
winit = "notify-rust"
gtk = "gio::Notification + Application::send_notification"
qt = "KNotification (KDE) / QSystemTrayIcon::showMessage"
cosmic = "org.freedesktop.Notifications via notify-rust (cosmic-notifications daemon)"
win32 = "Windows.UI.Notifications ToastNotificationManager (WinRT)"
web = "Notification API / WebOS notification center"

[apis.clipboard]
