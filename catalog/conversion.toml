# ---------------------------------------------------------------------------------------------
# Non-color tokens.
# ---------------------------------------------------------------------------------------------
[tokens.shape]
web = "--md-sys-shape-corner-{none,extra-small,small,medium,large,extra-large,full}"
gtk = "border-radius in generated CSS per widget class (libadwaita has no radius variables)"
qt = "Material.roundedScale (Qt 6.5+) or Bun UI style radius"
cosmic = "theme.corner_radii { radius_0, radius_xs, radius_s, radius_m, radius_l, radius_xl }"
egui = "visuals.widgets.*.corner_radius, window_corner_radius, menu_corner_radius"
bevy = "BorderRadius"
winui = "ControlCornerRadius, OverlayCornerRadius"
kde = "Breeze: none (fixed); Kirigami.Units.cornerRadius"
hyprland = "decoration:rounding"

[tokens.spacing]
web = "--md-sys-spacing-* (4dp grid)"
gtk = "margin/padding in generated CSS; AdwClamp maximum-size"
qt = "Kirigami.Units.smallSpacing / largeSpacing / gridUnit"
