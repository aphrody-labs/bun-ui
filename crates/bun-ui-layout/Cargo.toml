# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun-ui-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "One CSS layout engine for every Bun UI host: a CSS subset (Lightning CSS) laid out by Taffy"
repository = "https://github.com/aphrody-labs/bun-ui"
publish = false

# Standalone until Bun UI has one root Cargo workspace.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
# CSS -> bevy::ui::Node (Bevy 0.20, the version Bun OS pins).
bevy = ["dep:bevy"]
# Computed rects as egui::Rect for Ui::put.
egui = ["dep:egui"]

[dependencies]
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
# Pinned: Taffy 0.15 changed the low-level tree traits and the alignment types.
taffy = { version = "=0.15.0", default-features = false, features = [
  "std",
  "taffy_tree",
  "flexbox",
  "grid",
  "block_layout",
  "content_size",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "=0.20.0", optional = true, default-features = false, features = ["std", "bevy_ui"] }
egui = { version = "0.37", optional = true, default-features = false }

[[example]]
name = "settings"
path = "examples/settings.rs"
