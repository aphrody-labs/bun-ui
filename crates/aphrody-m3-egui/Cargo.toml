# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Material 3 adapter for egui: Visuals/Style from a DynamicScheme, system theme following and M3 widgets."
publish = false


[lints.rust]
unsafe_code = "forbid"

[dependencies]
aphrody-m3-tokens = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
