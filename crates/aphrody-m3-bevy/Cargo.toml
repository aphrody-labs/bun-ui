# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Material 3 theme and skins for Bevy UI and the bevy_ui_widgets headless widgets"
repository = "https://github.com/aphrody-labs/bun-ui"
publish = false


[lints.rust]
unsafe_code = "forbid"

[dependencies]
aphrody-m3-tokens = { workspace = true }
accesskit = { workspace = true }
# Bevy 0.20, the version Bun OS pins; minimal features.
bevy = { workspace = true, features = [
  "std",
  "bevy_ui",
  "bevy_ui_widgets",
  "bevy_text",
  "bevy_window",
  "bevy_input_focus",
  "bevy_picking",
  "ui_picking",
] }

[dev-dependencies]
bevy = { workspace = true, features = [
  "std",
  "multi_threaded",
  "async_executor",
  "bevy_log",
  "bevy_winit",
  "x11",
  "default_font",
  "ui_api",
  "ui_bevy_render",
  "bevy_ui_widgets",
  "ui_picking",
] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
