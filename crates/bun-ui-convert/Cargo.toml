[package]
name = "bun-ui-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Converts a constrained Material 3 TSX/JSX + CSS subset to GtkBuilder XML, QML and egui code."
publish = false
autoexamples = false


[dependencies]
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
lightningcss = { workspace = true }

[[bin]]
name = "m3-convert"
path = "src/main.rs"
