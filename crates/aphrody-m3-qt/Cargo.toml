# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-qt"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Material 3 adapter for Qt 6 through cxx-qt: the M3Scheme QML singleton and a QPalette filler for Qt Widgets."
publish = false
links = "aphrody_m3_qt"


[dependencies]
aphrody-m3-emit = { workspace = true }
aphrody-m3-tokens = { workspace = true }
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }

[build-dependencies]
cxx-qt-build = "0.10"
