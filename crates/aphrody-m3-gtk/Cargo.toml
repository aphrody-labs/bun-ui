# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Material 3 adapter for GTK 4 / libadwaita: aphrody-m3-emit CSS, M3 widget helpers and Material Symbols icons."
publish = false


[dependencies]
aphrody-m3-emit = { workspace = true }
aphrody-m3-tokens = { workspace = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
