# Meson cross file: Linux -> Windows x86_64 (llvm-mingw + MSYS2 CLANG64 sysroot).
# Use after the generated paths file, which defines the constants:
#   meson setup build-win $(bun tools/cross/windows.ts meson-cross --target x86_64)

[binaries]
c = llvm_mingw / 'bin' / triple + '-clang'
cpp = llvm_mingw / 'bin' / triple + '-clang++'
ar = llvm_mingw / 'bin' / 'llvm-ar'
ranlib = llvm_mingw / 'bin' / 'llvm-ranlib'
strip = llvm_mingw / 'bin' / 'llvm-strip'
windres = llvm_mingw / 'bin' / triple + '-windres'
pkg-config = 'pkg-config'
exe_wrapper = 'wine'

[built-in options]
c_args = sysroot_args
cpp_args = sysroot_args
c_link_args = sysroot_args
cpp_link_args = sysroot_args

[properties]
sys_root = sysroot
pkg_config_libdir = [prefix / 'lib' / 'pkgconfig', prefix / 'share' / 'pkgconfig']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
